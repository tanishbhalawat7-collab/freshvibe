<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d2e">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; base-uri 'none'; form-action 'self'">
  <title>Fresh Vibe — AI Smart Expiry Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%2310b981'/><path d='M7 17c0-6 4-10 10-10 0 6-4 10-10 10Zm0 0 5-5' stroke='%230b2e22' stroke-width='2' fill='none' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark" id="brand-mark"></span>
        <span><div class="brand-name">Fresh Vibe</div><div class="brand-sub">AI Smart Expiry Tracker</div></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <a class="cam-mini" href="#/camera" id="cam-mini" style="color:inherit;text-decoration:none">
          <span class="dot" id="cam-dot"></span><span id="cam-text">Camera: checking…</span>
        </a>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menu-btn" aria-label="Open menu"></button>
        <div class="title" id="page-title">Dashboard</div>
        <div class="spacer"></div>
        <a class="btn btn-primary btn-sm" href="#/scan" id="quick-scan"></a>
        <div class="bell" id="bell-wrap">
          <button class="btn btn-ghost btn-icon" id="bell" aria-label="Notifications" aria-haspopup="true"></button>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:40px">Fresh Vibe needs JavaScript enabled.</p></noscript>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
